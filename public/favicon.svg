<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0a4a"/>
      <stop offset="70%" stop-color="#07002a"/>
      <stop offset="100%" stop-color="#02000a"/>
    </radialGradient>
    <linearGradient id="ship" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81e7ff"/>
      <stop offset="60%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background disc -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#00e5ff" stroke-width="2"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="14" cy="18" r="0.9"/>
    <circle cx="48" cy="14" r="0.7"/>
    <circle cx="52" cy="38" r="1"/>
    <circle cx="10" cy="44" r="0.8"/>
    <circle cx="20" cy="50" r="0.6"/>
    <circle cx="44" cy="48" r="0.7"/>
  </g>
  <g fill="#ff4081">
    <circle cx="18" cy="32" r="0.8"/>
    <circle cx="46" cy="28" r="0.9"/>
  </g>

  <!-- Player ship -->
  <g filter="url(#glow)">
    <polygon points="32,16 46,46 32,40 18,46" fill="url(#ship)" stroke="#00e5ff" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Cockpit -->
    <circle cx="32" cy="30" r="2.6" fill="#fff176"/>
    <!-- Thruster -->
    <polygon points="28,46 32,52 36,46" fill="#ff9800"/>
  </g>
</svg>
